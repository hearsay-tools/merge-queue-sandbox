name: queue-check
on:
  pull_request:
  merge_group:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    name: queue-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR check
        if: github.event_name == 'pull_request'
        run: sleep 5
      - name: Record group
        if: github.event_name == 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          echo "EVIDENCE start at=$(date -u +%FT%TZ) run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "EVIDENCE group head_ref=$HEAD_REF head_sha=$HEAD_SHA base_sha=$BASE_SHA"
          echo "EVIDENCE checkout HEAD=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"
          echo "EVIDENCE parents $(git rev-list --parents -n1 HEAD)"
          pr=$(echo "$HEAD_REF" | sed -E 's#.*/pr-([0-9]+)-.*#\1#')
          git fetch -q origin "refs/pull/$pr/head"
          prhead=$(git rev-parse FETCH_HEAD)
          expected=$(git merge-tree --write-tree "$BASE_SHA" "$prhead")
          echo "EVIDENCE tree pr=$pr pr_head=$prhead expected_tree_base_plus_pr=$expected"
          echo "EVIDENCE changed $(git diff --name-only 'HEAD^1' HEAD | tr '\n' ' ')"
          echo "EVIDENCE event $(jq -c '.merge_group' "$GITHUB_EVENT_PATH")"
      - name: Lookup at start
        if: github.event_name == 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/lookup.cjs lookup-start
      - name: Sleep
        if: github.event_name == 'merge_group'
        run: |
          secs=$(git diff --name-only 'HEAD^1' HEAD | sed -n 's/^SLEEP-\([0-9][0-9]*\)$/\1/p' | head -1)
          secs=${secs:-180}
          echo "EVIDENCE sleep secs=$secs at=$(date -u +%FT%TZ)"
          sleep "$secs"
          echo "EVIDENCE slept at=$(date -u +%FT%TZ)"
      - name: Lookup at end
        if: github.event_name == 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/lookup.cjs lookup-end
      - name: Fail marker
        if: github.event_name == 'merge_group'
        run: |
          if git diff --name-only 'HEAD^1' HEAD | grep -q '^FAIL'; then
            echo "EVIDENCE fail-marker present at=$(date -u +%FT%TZ)"; exit 1
          fi
          echo "EVIDENCE pass at=$(date -u +%FT%TZ)"
